[package]
name = "axum_http"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.49", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"